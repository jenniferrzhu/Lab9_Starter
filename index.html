<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 9</title>

    <style>
      button {
        margin: 3px;
      }

      button:hover {
        cursor: pointer;
      }

      #first-num,
      #second-num {
        width: 60px;
      }

      output {
        border: 1px solid gray;
        display: block;
        height: 18px;
        margin-top: 5px;
        padding: 5px;
        width: 240px;
      }

      main {
        width: 800px;
      }

      #error-btns {
        column-gap: 5px;
        display: flex;
        flex-wrap: wrap;
        margin-top: 30px;
        row-gap: 5px;
      }

      #error-btns > * {
        padding: 8px 2px;
        width: 122px;
      }
    </style>
  </head>

  <body>
    <main>
      <form>
        <fieldset>
          <legend>Error Calculator</legend>
          <input name="first-num" id="first-num" />
          <select name="operator" id="operator">
            <option>+</option>
            <option>-</option>
            <option>*</option>
            <option>/</option>
          </select>
          <input name="second-num" id="second-num" />
          <button id="calculate" type="submit">Calculate</button>
          <br />
          <output></output>
        </fieldset>
      </form>

      <section id="error-btns">
        <button type="button" data-action="consoleLog">Console Log</button>
        <button type="button" data-action="consoleErr">Console Error</button>
        <button type="button" data-action="consoleCount">Console Count</button>
        <button type="button" data-action="consoleWarn">Console Warn</button>
        <button type="button" data-action="consoleAssert">
          Console Assert
        </button>
        <button type="button" data-action="consoleClear">Console Clear</button>
        <button type="button" data-action="consoleDir">Console Dir</button>
        <button type="button" data-action="consoleDirxml">
          Console dirxml
        </button>
        <button type="button" data-action="consoleGroupStart">
          Console Group Start
        </button>
        <button type="button" data-action="consoleGroupEnd">
          Console Group End
        </button>
        <button type="button" data-action="consoleTable">Console Table</button>
        <button type="button" data-action="startTimer">Start Timer</button>
        <button type="button" data-action="endTimer">End Timer</button>
        <button type="button" data-action="consoleTrace">Console Trace</button>
        <button type="button" data-action="triggerGlobalError">
          Trigger a Global Error
        </button>
      </section>
    </main>

    <script src="https://cdn.trackjs.com/agent/v3/latest/t.js"></script>
    <script>
      window.TrackJS &&
        TrackJS.install({
          token: "b13143c030a9440ab92c94cb1b5501c2",
          // for more configuration options, see https://docs.trackjs.com
        });
    </script>
    <script src="functions.js"></script>
  </body>
</html>
